<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sal a conversar</title>
<meta name="description" content="Calles y materiales para quienes salen a conversar.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2d6fb8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232d6fb8%22/><circle cx=%2250%22 cy=%2250%22 r=%2224%22 fill=%22%23ff5ca8%22/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Identidad «La Gran Quedada»: la plaza vista desde arriba.
     Suelo azul, texto blanco y el rosa como único acento
     (la acción principal, lo elegido, el hilo y el punto final).
     ============================================================ */
  :root {
    --plaza-suelo: #2d6fb8;
    --plaza-sombra: #1e5698;
    --plaza-tinta: #0e2a47;
    --plaza-blanco: #ffffff;
    --plaza-rosa: #ff5ca8;
    --plaza-rosa-oscuro: #c93a80;
    --plaza-amarillo: #ffd23f;
    --plaza-celeste: #a9d3f5;
    --plaza-hueso: #f4f1ea;
    --plaza-linea: rgba(255, 255, 255, .75);
    --panel-gris: #4a5a6c;
    --panel-borde: #d5d9de;
    --acento-claro: #e7f0fa;
    --marcador: #5b6b7d;

    --fondo: var(--plaza-suelo);
    --texto: var(--plaza-blanco);
    --texto-suave: rgba(255, 255, 255, .93);
    --borde: rgba(255, 255, 255, .45);
    --foco: var(--plaza-blanco);
    --subrayado: var(--plaza-rosa);
    --acento: var(--plaza-rosa);
    --sobre-acento: var(--plaza-tinta);

    --font-archivo: "Archivo", ui-sans-serif, system-ui, sans-serif;
    --radius-punta: 4px;
    --radius-hoja: 14px;
    --radius-globo: 16px;
    --radius-caja: 20px;
    --radius-pildora: 9999px;
    --tactil-min: 44px;
    --boton-alto: 48px;
    --gutter: 20px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: var(--font-archivo);
    font-size: 17px;
    line-height: 1.5;
    caret-color: var(--plaza-rosa);
    padding-bottom: 96px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--plaza-suelo);
  }
  ::selection { background: var(--plaza-rosa); color: var(--plaza-tinta); }
  h1, h2, p, ul { margin: 0; }
  ul { padding: 0; list-style: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--foco); outline-offset: 3px; }
  [hidden] { display: none !important; }
  .oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .col { max-width: 560px; margin: 0 auto; padding: 0 var(--gutter); }

  /* Registro cartel: Archivo ancho, negro, en mayúsculas y con punto final rosa */
  .marca, .titulo, .marcador-num, .resumen-num, .contador-num {
    font-stretch: 125%;
    font-weight: 900;
  }
  .punto { color: var(--plaza-rosa); }

  .cabecera .col { display: flex; align-items: center; min-height: 52px; }
  .marca { font-size: 14px; line-height: 1.3; letter-spacing: .02em; text-transform: uppercase; }

  .vista { padding-top: 10px; }
  .titulo {
    font-size: clamp(28px, 8.6vw, 52px);
    line-height: .92;
    letter-spacing: -.02em;
    text-transform: uppercase;
    overflow-wrap: anywhere;
  }
  .seccion, .grupo h2 { font-size: 24px; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; }
  .entrada { color: var(--texto-suave); margin-top: 8px; max-width: 34em; }
  .pie-nota { color: var(--texto-suave); font-size: 13px; line-height: 1.45; margin-top: 20px; }

  /* Enlace de texto: subrayado rosa de 3px */
  .btn-texto {
    flex: none;
    display: inline-flex;
    align-items: center;
    min-height: var(--tactil-min);
    padding: 0;
    background: none;
    border: 0;
    color: inherit;
    font-weight: 700;
    text-decoration: underline;
    text-decoration-color: var(--subrayado);
    text-decoration-thickness: 3px;
    text-underline-offset: 6px;
    cursor: pointer;
  }

  /* Botones: todo lo que se pulsa es una píldora */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: var(--boton-alto);
    padding: 0 20px;
    border: 2px solid transparent;
    border-radius: var(--radius-pildora);
    font: inherit;
    font-size: 17px;
    font-weight: 800;
    line-height: 1.2;
    text-align: center;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }
  .btn--sumar { background: var(--acento); color: var(--sobre-acento); transition: transform .15s; }
  .btn--sumar:hover { transform: translateY(-1px); }
  .btn--sumar:active { transform: scale(.98); }
  .btn--borde { background: transparent; border-color: currentColor; color: inherit; font-weight: 700; }

  /* Campo de búsqueda: píldora blanca */
  .buscar {
    display: flex;
    align-items: center;
    margin-top: 16px;
    padding: 0 20px;
    min-height: 52px;
    background: var(--plaza-blanco);
    border-radius: var(--radius-pildora);
    color: var(--plaza-tinta);
  }
  .buscar:focus-within { outline: 3px solid var(--foco); outline-offset: 3px; }
  .buscar input {
    flex: 1;
    min-width: 0;
    min-height: 48px;
    border: 0;
    background: transparent;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    font: inherit;
    font-size: 18px;
    color: var(--plaza-tinta);
  }
  .buscar input::placeholder { color: var(--marcador); opacity: 1; }

  /* Inicio: la cifra y la plaza */
  .marcador { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  .marcador-num { flex: none; font-size: clamp(40px, 11vw, 60px); line-height: 1; font-variant-numeric: tabular-nums; }
  .marcador-txt { line-height: 1.3; color: var(--texto-suave); }
  .escena { position: relative; overflow: hidden; background: var(--plaza-sombra); }
  .escena--grande { aspect-ratio: 16 / 5; margin: 16px calc(-1 * var(--gutter)) 0; }
  .escena-plaza { position: absolute; inset: 0; width: 100%; height: 100%; }
  .plaza-linea { fill: none; stroke: var(--plaza-linea); stroke-width: 2; }
  .plaza-hilo { fill: none; stroke: var(--plaza-rosa); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .plaza-hilo-dibuja { stroke-dasharray: 1; stroke-dashoffset: 1; animation: plaza-hilo 1.2s ease-out .2s forwards; }
  @keyframes plaza-hilo { to { stroke-dashoffset: 0; } }
  #titulo-donde { margin-top: 26px; }
  #sin-provincia { margin-top: 14px; }

  /* Provincias: opciones de línea blanca, como las líneas de la plaza */
  .provincias { display: grid; gap: 10px; margin-top: 14px; }
  @media (min-width: 440px) { .provincias { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .provincias li { display: flex; }
  .provincia {
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    min-height: 72px;
    padding: 14px 16px;
    background: transparent;
    border: 1.5px solid var(--plaza-blanco);
    border-radius: var(--radius-hoja);
    color: var(--plaza-blanco);
    text-align: left;
    cursor: pointer;
  }
  .provincia:hover { background: rgba(255, 255, 255, .12); }
  .provincia > span:first-child { min-width: 0; }
  .provincia-nombre { display: block; font-size: 20px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
  .provincia-dato { display: block; margin-top: 2px; font-size: 14px; color: var(--texto-suave); }
  /* Las conversaciones de cada provincia van en un globo, con su esquina en punta */
  .provincia-conv {
    flex: none;
    min-width: 42px;
    padding: 5px 11px;
    background: var(--plaza-blanco);
    border-radius: var(--radius-globo) var(--radius-globo) var(--radius-globo) var(--radius-punta);
    color: var(--plaza-tinta);
    font-size: 16px;
    font-weight: 800;
    line-height: 1.2;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .provincia-conv--cero { background: transparent; box-shadow: inset 0 0 0 1.5px var(--borde); color: var(--plaza-blanco); }

  /* Provincia abierta */
  .resumen { margin-top: 6px; color: var(--texto-suave); line-height: 1.3; }
  .resumen-num { display: inline-block; margin-right: 4px; font-size: 28px; line-height: 1; color: var(--texto); font-variant-numeric: tabular-nums; }
  #fijada { margin-top: 22px; }
  .fijada-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  #titulo-todas { margin-top: 30px; }
  #titulo-todas + .buscar { margin-top: 10px; }

  /* Filtro por municipio */
  .zonas {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin: 6px calc(-1 * var(--gutter)) 0;
    padding: 10px var(--gutter);
    background: var(--plaza-suelo);
    scrollbar-width: none;
  }
  .zonas::-webkit-scrollbar { display: none; }
  .zona-chip {
    flex: none;
    min-height: var(--tactil-min);
    padding: 0 18px;
    background: transparent;
    border: 1.5px solid var(--plaza-blanco);
    border-radius: var(--radius-pildora);
    color: var(--plaza-blanco);
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }
  .zona-chip:hover { background: rgba(255, 255, 255, .12); }
  .zona-chip[aria-pressed="true"] { background: var(--plaza-rosa); border-color: var(--plaza-rosa); color: var(--plaza-tinta); }
  .desplegable { position: relative; flex: 1; min-width: 0; }
  .desplegable select {
    width: 100%;
    min-height: 48px;
    padding: 0 48px 0 20px;
    border: 0;
    border-radius: var(--radius-pildora);
    background: var(--plaza-blanco);
    color: var(--plaza-tinta);
    font: inherit;
    font-weight: 700;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }
  .desplegable::after {
    content: "";
    position: absolute;
    right: 22px;
    top: 50%;
    width: 9px;
    height: 9px;
    border-right: 2.5px solid var(--plaza-tinta);
    border-bottom: 2.5px solid var(--plaza-tinta);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }

  /* Cada calle es un globo blanco */
  .calles { display: grid; gap: 12px; }
  #lista > .calles { margin-top: 10px; }
  .calle, .hoja, .vacio { background: var(--plaza-blanco); color: var(--plaza-tinta); border-radius: var(--radius-globo); --foco: var(--plaza-tinta); }
  .calle { overflow: hidden; content-visibility: auto; contain-intrinsic-size: auto 280px; }
  .placa { display: block; padding: 16px 16px 0; }
  .placa-tipo { display: block; font-size: 13px; font-weight: 700; line-height: 1.3; color: var(--plaza-rosa-oscuro); }
  .placa-nombre { display: block; font-size: 22px; font-weight: 800; line-height: 1.15; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .placa-municipio { display: block; margin-top: 3px; font-size: 14px; line-height: 1.3; color: var(--panel-gris); }
  .calle-cuerpo { padding: 8px 16px 16px; }
  .tramo { font-weight: 500; }
  .nota-calle { margin-top: 4px; font-size: 15px; line-height: 1.4; color: var(--panel-gris); }
  .acciones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  @media (max-width: 330px) { .acciones { grid-template-columns: 1fr; } }
  .calle .acciones .btn { padding: 0 10px; }

  /* Contador de cada calle: un trozo de plaza con gente caminando */
  .contador {
    position: relative;
    display: flex;
    align-items: stretch;
    min-height: 78px;
    margin-top: 12px;
    overflow: hidden;
    border-radius: var(--radius-hoja);
    background: var(--plaza-sombra);
    color: var(--plaza-blanco);
  }
  .contador-cifra { flex: none; display: flex; align-items: center; gap: 10px; max-width: 64%; margin: 0; padding: 10px 4px 10px 14px; }
  .contador-num { display: inline-block; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; transform-origin: left center; }
  .contador-txt { font-size: 14px; line-height: 1.25; color: var(--texto-suave); }
  .calle-escena { position: relative; flex: 1; min-width: 0; }
  .calle-escena::after { content: ""; position: absolute; left: 0; right: 0; bottom: 9px; height: 2px; background: var(--plaza-linea); }
  .contador[data-n="0"] .contador-cifra { flex: 1; min-width: 0; max-width: none; padding-right: 14px; }
  .contador[data-n="0"] .calle-escena { display: none; }

  .vacio { margin-top: 10px; padding: 20px 16px; }
  .vacio p { margin-bottom: 14px; }

  /* Materiales */
  .grupo { margin-top: 26px; }
  #v-materiales .zonas + div > .grupo:first-child { margin-top: 12px; }
  .grupo h2 { margin-bottom: 10px; }
  .hoja { overflow: hidden; }
  .hoja li + li { border-top: 1px solid var(--panel-borde); }
  .fila { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 14px 16px; color: inherit; text-decoration: none; }
  a.fila:hover { background: var(--acento-claro); }
  a.fila:focus-visible { outline-offset: -3px; }
  .tipo { flex: none; min-width: 40px; font-size: 13px; font-weight: 700; color: var(--plaza-rosa-oscuro); }
  .fila-texto { flex: 1; min-width: 0; }
  .fila-titulo { display: block; font-weight: 700; line-height: 1.25; }
  .fila-desc { display: block; margin-top: 2px; font-size: 15px; line-height: 1.35; color: var(--panel-gris); }
  .fila-flecha { flex: none; font-weight: 800; }
  .pronto { flex: none; padding: 2px 10px; border: 1.5px solid var(--panel-borde); border-radius: var(--radius-pildora); font-size: 13px; color: var(--panel-gris); }

  /* Pestañas */
  .pestanas {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--plaza-sombra);
  }
  .pestanas-dentro { display: flex; gap: 8px; max-width: 560px; margin: 0 auto; padding: 0 var(--gutter); }
  .pestana {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    border-radius: var(--radius-pildora);
    color: var(--plaza-blanco);
    font-weight: 700;
    text-decoration: none;
  }
  .pestana:hover { background: rgba(255, 255, 255, .12); }
  .pestana[aria-current="page"] { background: var(--plaza-rosa); color: var(--plaza-tinta); font-weight: 800; }

  /* Caminantes: personas pixeladas que pasean, con los colores de las camisetas */
  .caminante {
    position: absolute;
    z-index: 1;
    color: var(--plaza-amarillo);
    animation: pasea var(--t, 20s) linear var(--r, 0s) infinite;
  }
  .caminante.c1 { color: var(--plaza-celeste); }
  .caminante.c2 { color: var(--plaza-hueso); }
  .caminante svg { display: block; width: calc(22px * var(--s, 1)); height: calc(28px * var(--s, 1)); shape-rendering: crispEdges; }
  .caminante .pb { visibility: hidden; }
  .caminante .pa { animation: paso-a .64s steps(1) var(--p, 0s) infinite; }
  .caminante .pb { animation: paso-b .64s steps(1) var(--p, 0s) infinite; }
  .caminante.entra svg { animation: aparece .6s steps(5) var(--d, 0s) both; }
  @keyframes paso-a { 0%, 100% { visibility: visible; } 50% { visibility: hidden; } }
  @keyframes paso-b { 0%, 100% { visibility: hidden; } 50% { visibility: visible; } }
  @keyframes aparece { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  @keyframes pasea {
    0% { transform: translate(0, 0); }
    25% { transform: translate(var(--x1), var(--y1)); }
    50% { transform: translate(var(--x2), var(--y2)); }
    75% { transform: translate(var(--x3), var(--y3)); }
    100% { transform: translate(0, 0); }
  }
  @keyframes bote {
    0% { transform: scale(1); }
    35% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  @keyframes chispa {
    from { transform: translate(0, 0) rotate(0); opacity: 1; }
    to { transform: translate(var(--dx), var(--dy)) rotate(240deg); opacity: 0; }
  }
  .bote { animation: bote .45s ease-out; }
  .chispa { position: absolute; z-index: 2; width: 6px; height: 6px; pointer-events: none; animation: chispa .75s ease-out forwards; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .plaza-hilo-dibuja { stroke-dasharray: none; stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

<header class="cabecera">
  <div class="col">
    <span class="marca">La Gran Quedada<span class="punto" aria-hidden="true">.</span></span>
  </div>
</header>

<main class="col">
  <section class="vista" id="v-calles" aria-label="Calles"></section>
  <section class="vista" id="v-materiales" aria-label="Materiales" hidden></section>
</main>

<nav class="pestanas" aria-label="Secciones">
  <div class="pestanas-dentro">
    <a class="pestana" href="#calles" data-vista="calles">Calles</a>
    <a class="pestana" href="#materiales" data-vista="materiales">Materiales</a>
  </div>
</nav>

<script>
/* ============================================================
   SAL A CONVERSAR
   Los datos (calles y materiales) y el contador de
   conversaciones viven en el Google Sheet. Esta página los pide al
   Apps Script publicado como aplicación web.
   ============================================================ */
const API = 'https://script.google.com/macros/s/AKfycbwKw-ePZ7au3QTooiBc2gelvk4JRyVvfy78jkQQsy_ZuDtH1HnGgrrnrUQDqPkIbFXAWQ/exec';
const REFRESCO = 25000;       // cada cuánto se actualizan los totales (ms)
const MAX_POR_ENVIO = 50;     // el mismo tope que tiene el Apps Script

let CALLES = [], MATERIALES = [], PROVINCIAS = [];

/* ============================================================
   Utilidades
   ============================================================ */
const $ = (sel, raiz) => (raiz || document).querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const plural = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);
const texto = v => (v === null || v === undefined ? '' : String(v).trim());
const enlaceSeguro = v => (/^https?:\/\//i.test(texto(v)) ? texto(v) : '');

const guardado = {
  leer(clave, porDefecto) {
    try {
      const v = localStorage.getItem(clave);
      return v === null ? porDefecto : JSON.parse(v);
    } catch (e) { return porDefecto; }
  },
  escribir(clave, valor) {
    try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) { /* sin almacenamiento: sigue funcionando */ }
  }
};

const idCalle = c => [c.provincia, c.municipio, c.zona, c.calle, c.tramo].join('|');
const idZona = c => c.municipio + '|' + c.zona;

// Titular de cartel: acaba siempre en punto rosa
const cartel = html => '<h1 class="titulo">' + html + '<span class="punto" aria-hidden="true">.</span></h1>';

// Pide algo al Apps Script y devuelve su respuesta. Falla si no hay red o tarda demasiado.
async function pedir(url, opciones) {
  const control = new AbortController();
  const reloj = setTimeout(() => control.abort(), 20000);
  try {
    const r = await fetch(url, Object.assign({ signal: control.signal }, opciones || {}));
    if (!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally {
    clearTimeout(reloj);
  }
}

/* ============================================================
   Estado
   ============================================================ */
const estado = {
  carga: 'cargando',       // 'cargando' | 'lista' | 'error'
  conexion: true,
  provincia: null,          // la decide la dirección (#valladolid) o, si no dice nada, la última elegida
  municipio: null,          // filtro de la lista: null = todos los municipios
  busqueda: '',
  buscaProvincia: '',
  idioma: null              // idioma elegido en Materiales
};
let rutaResuelta = false;   // si ya se ha decidido qué provincia abrir al entrar
let municipiosVista = [];   // municipios de la provincia abierta, en el orden del filtro

// «Alicante/Alacant» -> «alicante-alacant»: el nombre de la provincia en la dirección
const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

/* El total de cada calle es lo que dice el Sheet más lo que esta persona ha
   sumado y aún no ha llegado: así el número sube al instante al pulsar. */
const suma = {
  servidor: new Map(),     // calle -> conversaciones según el Sheet
  pendientes: new Map(),   // calle -> sumadas aquí, a la espera de enviarse
  enVuelo: new Map(),      // calle -> enviándose ahora mismo
  cuentas: new Map()
};
(function recuperarPendientes() {
  const p = guardado.leer('sac:pendientes', {});
  if (p && typeof p === 'object') Object.keys(p).forEach(id => {
    const n = Math.floor(Number(p[id]));
    if (n > 0) suma.pendientes.set(id, n);
  });
})();
const guardarPendientes = () => guardado.escribir('sac:pendientes', Object.fromEntries(suma.pendientes));

let enviando = false, relojEnviar, ultimaFirma = '';
const MAX_MINI = 30;      // caminantes que caben en la tira de una calle
const MAX_GRANDE = 200;   // caminantes en la escena general

function recontar() {
  const m = new Map();
  const sumar = (n, id) => m.set(id, (m.get(id) || 0) + n);
  suma.servidor.forEach(sumar);
  suma.pendientes.forEach(sumar);
  suma.enVuelo.forEach(sumar);
  suma.cuentas = m;
}
function ponerTotales(obj) {
  const m = new Map();
  if (obj && typeof obj === 'object') Object.keys(obj).forEach(id => {
    const n = Math.floor(Number(obj[id]));
    if (n > 0) m.set(id, n);
  });
  suma.servidor = m;
  recontar();
}
const cuenta = id => suma.cuentas.get(id) || 0;
const filasProvincia = () => CALLES.filter(c => c.provincia === estado.provincia);

// Conversaciones de una provincia, o de todas si no se indica ninguna
function totalDe(provincia) {
  let todas = 0;
  CALLES.forEach(c => { if (!provincia || c.provincia === provincia) todas += cuenta(idCalle(c)); });
  return todas;
}
function firma() {
  return estado.conexion + '|' + filasProvincia().map(c => cuenta(idCalle(c))).join(',');
}

/* ============================================================
   Cargar los datos del Sheet
   ============================================================ */
function aplicarDatos(d) {
  CALLES = (Array.isArray(d.calles) ? d.calles : [])
    .map(c => ({ provincia: texto(c.provincia), municipio: texto(c.municipio), zona: texto(c.zona), calle: texto(c.calle), tramo: texto(c.tramo), nota: texto(c.nota) }))
    .filter(c => c.provincia && c.calle);
  MATERIALES = (Array.isArray(d.materiales) ? d.materiales : [])
    .map(m => ({ grupo: texto(m.grupo) || 'Materiales', titulo: texto(m.titulo), descripcion: texto(m.descripcion), tipo: texto(m.tipo) || 'Doc', enlace: enlaceSeguro(m.enlace), idioma: idiomaDe(m.idioma) }))
    .filter(m => m.titulo);
  PROVINCIAS = [...new Set(CALLES.map(c => c.provincia))].sort((a, b) => a.localeCompare(b, 'es'));
  if (!PROVINCIAS.includes(estado.provincia)) estado.provincia = null;
  ponerTotales(d.conversaciones);
  estado.carga = 'lista';
}

async function cargar() {
  try {
    const d = await pedir(API + '?accion=datos');
    if (!d || !d.ok) throw new Error((d && d.error) || 'respuesta');
    const contenido = JSON.stringify([d.calles, d.materiales]);
    const mismoContenido = estado.carga === 'lista' && contenido === contenidoPintado;
    guardado.escribir('sac:datos', { calles: d.calles, materiales: d.materiales, conversaciones: d.conversaciones });
    estado.conexion = true;
    if (mismoContenido) {
      ponerTotales(d.conversaciones);
      actualizarTotales();
    } else {
      const yaHabia = estado.carga === 'lista';
      aplicarDatos(d);
      contenidoPintado = contenido;
      aplicarRuta(false, yaHabia);
      pintarTodo();
    }
    if (suma.pendientes.size) enviar();
  } catch (e) {
    if (estado.carga === 'lista') { estado.conexion = false; actualizarTotales(); }
    else { estado.carga = 'error'; pintarTodo(); }
  }
}
let contenidoPintado = '';

// Solo los totales, cada poco, mientras la página está a la vista
async function refrescar() {
  if (document.visibilityState !== 'visible' || estado.carga !== 'lista' || enviando) return;
  try {
    const d = await pedir(API + '?accion=totales');
    if (!d || !d.ok || enviando) return;
    ponerTotales(d.conversaciones);
    estado.conexion = true;
    actualizarTotales();
    if (suma.pendientes.size) enviar();
  } catch (e) {
    if (estado.conexion) { estado.conexion = false; actualizarTotales(); }
  }
}

// Pone al día lo que muestra números, sin repintar la pantalla
function actualizarTotales() {
  if (estado.carga !== 'lista') return;
  if (!estado.provincia) { pintarSelector(); return; }
  if (firma() !== ultimaFirma) actualizarCifras();
}

/* ============================================================
   Enviar las conversaciones sumadas
   ============================================================ */
function programarEnvio() {
  clearTimeout(relojEnviar);
  relojEnviar = setTimeout(enviar, 700);   // varios toques seguidos viajan juntos
}

async function enviar() {
  if (enviando || !suma.pendientes.size) return;
  enviando = true;
  let fallo = false;
  try {
    while (suma.pendientes.size && !fallo) {
      const [id, total] = suma.pendientes.entries().next().value;
      const n = Math.min(total, MAX_POR_ENVIO);
      if (total > n) suma.pendientes.set(id, total - n); else suma.pendientes.delete(id);
      suma.enVuelo.set(id, n);
      guardarPendientes();
      try {
        const r = await pedir(API, { method: 'POST', body: JSON.stringify({ accion: 'sumar', calle: id, n: n }), keepalive: true });
        suma.enVuelo.delete(id);
        if (r && r.ok) ponerTotales(r.conversaciones);
        else if (!r || r.error !== 'calle_desconocida') throw new Error((r && r.error) || 'respuesta');
      } catch (e) {
        // No ha llegado: se guarda para volver a intentarlo
        suma.enVuelo.delete(id);
        suma.pendientes.set(id, (suma.pendientes.get(id) || 0) + n);
        guardarPendientes();
        fallo = true;
      }
    }
  } finally {
    enviando = false;
  }
  recontar();
  estado.conexion = !fallo;
  actualizarTotales();
}

/* ============================================================
   Calles
   ============================================================ */
// «Calle de la Oca» se rotula como en una placa: tipo de vía pequeño, nombre grande
function rotulo(nombre) {
  const m = nombre.match(/^(Calle|Avenida|Paseo|Plaza|Camino|Ronda|Travesía|Carretera|Glorieta|Pasaje|Callejón)((?:\s+(?:de las|de los|de la|del|de))?)\s+(.+)$/i);
  if (!m) return '<span class="placa-nombre">' + esc(nombre) + '</span>';
  return '<span class="placa-tipo">' + esc(m[1] + m[2]) + '</span><span class="placa-nombre">' + esc(m[3]) + '</span>';
}

/* Caminantes: personas pixeladas que pasean por la escena.
   Cada una se dibuja con dos posturas que se alternan para dar el paso. */
const POSTURAS = {
  a: ['....###....', '....###....', '....###....', '.....#.....', '..#######..', '.#..###..#.', '#...###...#',
      '....###....', '....###....', '...##.##...', '...#...#...', '..##...##..', '..#.....#..', '.##.....##.'],
  b: ['....###....', '....###....', '....###....', '.....#.....', '..#######..', '..#.###.#..', '..#.###.#..',
      '....###....', '....###....', '....#.#....', '....#.#....', '...##.#....', '...#..##...', '...#...#...']
};
(function dibujarPosturas() {
  const trazo = filas => {
    let d = '';
    filas.forEach((fila, y) => {
      for (let x = 0; x < fila.length; x++) {
        if (fila[x] !== '#') continue;
        let ancho = 1;
        while (fila[x + ancho] === '#') ancho++;
        d += 'M' + x + ' ' + y + 'h' + ancho + 'v1h-' + ancho + 'z';
        x += ancho - 1;
      }
    });
    return d;
  };
  document.body.insertAdjacentHTML('afterbegin',
    '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>' +
    '<path id="paso-a" d="' + trazo(POSTURAS.a) + '"/><path id="paso-b" d="' + trazo(POSTURAS.b) + '"/></defs></svg>');
})();

// Un número entre 0 y 1 que siempre es el mismo para la misma persona: así no cambia de sitio al repintar
function azar(i, k) {
  const x = Math.sin((i + 1) * 127.1 + k * 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function caminante(i, grande, entra, retraso) {
  const a = k => azar(i, k);
  // Reparto parejo por la escena: cada persona nueva cae lejos de las anteriores
  const reparto = (semilla, salto) => { const v = semilla + i * salto; return v - Math.floor(v); };
  const ancho = reparto(0.37, 0.6180339887);
  const fondo = reparto(0.21, 0.7548776662);   // 0 = lejos (arriba, pequeña), 1 = cerca (abajo, grande)
  const paseo = grande ? [46, 9] : [16, 4];
  let estilo = grande
    ? 'left:' + (2 + ancho * 88).toFixed(1) + '%;top:' + (4 + fondo * 44).toFixed(1) + '%;--s:' + (0.75 + fondo * 0.7).toFixed(2) + ';z-index:' + (1 + Math.round(fondo * 50)) + ';'
    : 'left:' + (ancho * 80).toFixed(1) + '%;top:' + (8 + fondo * 22).toFixed(1) + '%;--s:' + (0.9 + fondo * 0.2).toFixed(2) + ';';
  estilo += '--t:' + (16 + a(3) * 16).toFixed(1) + 's;--r:-' + (a(4) * 20).toFixed(1) + 's;--p:-' + (a(5) * 0.6).toFixed(2) + 's;';
  [1, 2, 3].forEach(n => {
    estilo += '--x' + n + ':' + Math.round((a(5 + n) * 2 - 1) * paseo[0]) + 'px;--y' + n + ':' + Math.round((a(8 + n) * 2 - 1) * paseo[1]) + 'px;';
  });
  if (entra && retraso) estilo += '--d:' + retraso + 'ms;';
  return '<span class="caminante c' + (i % 3) + (entra ? ' entra' : '') + '" style="' + estilo + '">' +
    '<svg viewBox="0 0 11 14" fill="currentColor" aria-hidden="true"><use href="#paso-a" class="pa"/><use href="#paso-b" class="pb"/></svg></span>';
}

// Deja en la escena exactamente n caminantes, sin tocar a las que ya están paseando
function ajustarEscena(el, n, grande, entra) {
  if (!el) return;
  const presentes = el.querySelectorAll('.caminante');
  if (n < presentes.length) { [...presentes].slice(n).forEach(x => x.remove()); return; }
  let html = '';
  // Entran escalonadas, sin tardar más de dos segundos aunque sean muchas
  const paso = Math.min(45, 1800 / Math.max(1, n - presentes.length));
  for (let i = presentes.length; i < n; i++) html += caminante(i, grande, entra, Math.round((i - presentes.length) * paso));
  if (html) el.insertAdjacentHTML('beforeend', html);
}

// Los nombres dobles («Alicante/Alacant») pueden partirse justo después de la barra
const conCorte = s => esc(s).replace(/\//g, '/<wbr>');

const AVISO_SIN_RED = 'Sin conexión: los totales pueden no estar al día. Lo que sumes se enviará cuando vuelva.';

// Lo que se ve mientras llegan los datos, o si no llegan
function avisoCarga(titulo, cosa) {
  if (estado.carga === 'cargando') return cartel(titulo) + '<p class="entrada">Cargando ' + cosa + '…</p>';
  return cartel(titulo) + '<div class="vacio"><p>No se han podido cargar ' + cosa +
    '. Comprueba tu conexión y vuelve a intentarlo.</p><button class="btn btn--borde" data-reintentar>Volver a intentar</button></div>';
}

// La plaza de la escena de inicio: marco, círculo central y el hilo rosa, que se dibuja al cargar
const PLAZA = '<svg class="escena-plaza" viewBox="0 0 400 125" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">' +
  '<rect class="plaza-linea" x="8" y="8" width="384" height="109"/>' +
  '<circle class="plaza-linea" cx="200" cy="62.5" r="40"/>' +
  '<path class="plaza-hilo plaza-hilo-dibuja" pathLength="1" d="M-6,34 C52,8 86,104 158,88 S236,16 300,44 S366,112 408,78"/></svg>';

let marcadorPintado = null;      // último total mostrado en el marcador
const provinciasPintadas = {};   // último total mostrado en cada provincia

// El número sube contando hasta su valor
function contarHasta(el, desde, hasta) {
  if (!el) return;
  const quieto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (quieto || desde === hasta) { el.textContent = hasta; return; }
  const inicio = performance.now(), dura = 900;
  const paso = ahora => {
    if (!el.isConnected) return;
    const t = Math.min(1, Math.max(0, (ahora - inicio) / dura));
    el.textContent = Math.round(desde + (hasta - desde) * (1 - Math.pow(1 - t, 3)));
    if (t < 1) requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
}

function pintarSelector() {
  const total = totalDe(null);
  const estreno = marcadorPintado === null;
  const tarjetas = PROVINCIAS.map(p => {
    const filas = CALLES.filter(c => c.provincia === p);
    const zonas = new Set(filas.map(idZona)).size;
    const n = totalDe(p);
    const sube = !estreno && n > (provinciasPintadas[p] || 0);
    provinciasPintadas[p] = n;
    return '<li data-nombre="' + esc(p) + '"><button class="provincia" data-provincia="' + esc(p) + '">' +
      '<span><span class="provincia-nombre">' + conCorte(p) + '</span>' +
      '<span class="provincia-dato">' + plural(filas.length, 'calle', 'calles') + ' en ' + plural(zonas, 'zona', 'zonas') + '</span></span>' +
      '<span class="provincia-conv' + (n ? '' : ' provincia-conv--cero') + (sube ? ' bote' : '') + '">' +
      n + '<span class="oculto"> ' + (n === 1 ? 'conversación' : 'conversaciones') + '</span>' +
      '</span></button></li>';
  }).join('');

  // La primera vez se monta la pantalla; después solo se actualizan los números y entra gente nueva
  if (!$('#escena-general')) {
    $('#v-calles').innerHTML =
      cartel('Sal a conversar') +
      '<div class="marcador"><span class="marcador-num" id="marcador-num">' + (estreno ? 0 : marcadorPintado) + '</span>' +
      '<span class="marcador-txt" id="marcador-txt"></span></div>' +
      '<div class="escena escena--grande" id="escena-general" aria-hidden="true">' + PLAZA + '</div>' +
      '<h2 class="seccion" id="titulo-donde">¿Dónde vas a conversar?</h2>' +
      '<p class="entrada">Elige tu provincia y suma cada conversación que tengas.</p>' +
      (PROVINCIAS.length > 8 ? '<label class="buscar buscar--provincia">' +
        '<input type="search" id="buscar-provincia" placeholder="Busca tu provincia" aria-label="Busca tu provincia" autocomplete="off" value="' + esc(estado.buscaProvincia) + '"></label>' : '') +
      '<ul class="provincias" id="provincias"></ul>' +
      '<p class="entrada" id="sin-provincia" hidden></p>' +
      '<p class="pie-nota" id="pie-selector"></p>';
  }
  $('#marcador-txt').textContent = total === 0 ? 'Todavía no hay conversaciones. La primera puede ser tuya.'
    : (total === 1 ? 'conversación' : 'conversaciones') + ' entre todas las provincias';
  $('#provincias').innerHTML = tarjetas;
  filtrarProvincias();
  $('#pie-selector').textContent = estado.conexion ? '' : AVISO_SIN_RED;
  $('#pie-selector').hidden = estado.conexion;
  ajustarEscena($('#escena-general'), Math.min(total, MAX_GRANDE), true, true);
  contarHasta($('#marcador-num'), estreno ? 0 : marcadorPintado, total);
  marcadorPintado = total;
}

// Deja a la vista solo las provincias que coinciden con lo escrito en el buscador
function filtrarProvincias() {
  const q = norm(estado.buscaProvincia.trim());
  let visibles = 0;
  document.querySelectorAll('#provincias > li').forEach(li => {
    const coincide = !q || norm(li.dataset.nombre).includes(q);
    li.hidden = !coincide;
    if (coincide) visibles++;
  });
  const aviso = $('#sin-provincia');
  if (!aviso) return;
  aviso.hidden = visibles > 0;
  aviso.textContent = visibles ? '' : 'No hay ninguna provincia con «' + estado.buscaProvincia.trim() + '». Prueba con otro nombre.';
}

function pintarProvincia() {
  // El filtro de arriba son los municipios de la provincia
  const delSheet = [...new Set(filasProvincia().map(c => c.municipio))];
  const nombre = m => m || 'Sin municipio';
  let filtro = '';
  if (delSheet.length > 6) {
    // Muchos municipios: desplegable, por orden alfabético
    municipiosVista = [...delSheet].sort((a, b) => nombre(a).localeCompare(nombre(b), 'es'));
    filtro = '<div class="zonas"><div class="desplegable"><select id="municipio" aria-label="Filtrar por municipio">' +
      '<option value="todos">Todos los municipios</option>' +
      municipiosVista.map((m, i) => '<option value="' + i + '">' + esc(nombre(m)) + '</option>').join('') +
      '</select></div></div>';
  } else {
    // Pocos: botones en fila, en el orden del Sheet
    municipiosVista = delSheet;
    if (delSheet.length > 1) filtro =
      '<div class="zonas" role="group" aria-label="Filtrar por municipio">' +
      '<button class="zona-chip" data-todos aria-pressed="true">Todos</button>' +
      delSheet.map(m => '<button class="zona-chip" data-municipio="' + esc(m) + '" aria-pressed="false">' + esc(nombre(m)) + '</button>').join('') +
      '</div>';
  }
  if (estado.municipio !== null && !municipiosVista.includes(estado.municipio)) estado.municipio = null;

  const fijada = calleFijada();
  $('#v-calles').innerHTML =
    '<div class="donde">' + cartel('Calles de ' + conCorte(estado.provincia)) +
    '<button class="btn-texto" id="cambiar-provincia">Cambiar provincia</button></div>' +
    '<p class="resumen" id="resumen"></p>' +
    (fijada ? '<div id="fijada"></div><h2 class="seccion" id="titulo-todas">Todas las calles</h2>' : '') +
    '<label class="buscar">' +
    '<input type="search" id="buscar" placeholder="Busca una calle o un municipio" aria-label="Busca una calle o un municipio" autocomplete="off" value="' + esc(estado.busqueda) + '"></label>' +
    filtro +
    '<div id="lista"></div>' +
    '<p class="pie-nota" id="pie-calles"></p>' +
    '<p class="pie-nota">Al sumar solo se guarda el número de conversaciones de cada calle. No pedimos ningún dato tuyo.</p>';
  if (fijada) {
    $('#fijada').innerHTML =
      '<div class="fijada-cab"><h2 class="seccion">Tu última calle</h2><button class="btn-texto" id="quitar-fijada">Quitar</button></div>' +
      '<ul class="calles">' + tarjetaCalle(fijada, municipiosVista.length > 1) + '</ul>';
    ajustarEscena($('#fijada .calle-escena'), Math.min(cuenta(idCalle(fijada)), MAX_MINI), false, false);
  }
  pintarLista();
}

// La última calle en la que esta persona sumó, si es de la provincia abierta
function calleFijada() {
  const u = guardado.leer('sac:ultima', null);
  if (!u || u.provincia !== estado.provincia) return null;
  return filasProvincia().find(c => idCalle(c) === u.id) || null;
}

function pintarResumen(conBote) {
  const total = totalDe(estado.provincia);
  $('#resumen').innerHTML = total === 0 ? 'Aún no hay conversaciones en ' + esc(estado.provincia) + '. Suma la primera.'
    : '<span class="resumen-num' + (conBote ? ' bote' : '') + '" style="display:inline-block">' + total + '</span> ' +
      (total === 1 ? 'conversación' : 'conversaciones') + ' en ' + esc(estado.provincia);
  $('#pie-calles').textContent = estado.conexion ? '' : AVISO_SIN_RED;
  $('#pie-calles').hidden = estado.conexion;
}

// Pinta la lista entera: al entrar en la provincia, al filtrar o al buscar
function pintarLista() {
  if (!estado.provincia || !$('#lista')) return;
  ultimaFirma = firma();
  const filas = filasProvincia();
  pintarResumen(false);

  document.querySelectorAll('.zona-chip').forEach(b => b.setAttribute('aria-pressed',
    String(b.hasAttribute('data-todos') ? estado.municipio === null : b.dataset.municipio === estado.municipio)));
  const desplegable = $('#municipio');
  if (desplegable) desplegable.value = estado.municipio === null ? 'todos' : String(municipiosVista.indexOf(estado.municipio));

  const q = norm(estado.busqueda.trim());
  const visibles = filas.filter(c =>
    (estado.municipio === null || c.municipio === estado.municipio) &&
    (!q || norm(c.calle + ' ' + c.zona + ' ' + c.municipio).includes(q)));

  if (!visibles.length) {
    $('#lista').innerHTML = '<div class="vacio"><p>No hay ninguna calle con «' + esc(estado.busqueda.trim()) +
      '»' + (estado.municipio === null ? '' : ' en este municipio') + '. Prueba con otro nombre o mira todas las calles.</p>' +
      '<button class="btn btn--borde" id="ver-todas">Ver todas las calles</button></div>';
    return;
  }

  // Las calles van seguidas, en el orden del Sheet, sin títulos de sección
  // El municipio se rotula en la placa solo si la provincia tiene más de uno
  const conMunicipio = municipiosVista.length > 1;
  $('#lista').innerHTML = '<ul class="calles">' + visibles.map(c => tarjetaCalle(c, conMunicipio)).join('') + '</ul>';
  document.querySelectorAll('#lista .calle').forEach(li =>
    ajustarEscena($('.calle-escena', li), Math.min(cuenta(li.dataset.calle), MAX_MINI), false, false));
}

// Cambia solo los números que han variado, sin repintar: la gente sigue paseando y entra la nueva
function actualizarCifras() {
  if (!estado.provincia || !$('#lista')) return;
  ultimaFirma = firma();
  let cambios = false;
  document.querySelectorAll('#v-calles .calle').forEach(li => {
    const n = cuenta(li.dataset.calle);
    const caja = $('.contador', li);
    if (Number(caja.dataset.n) === n) return;
    cambios = true;
    caja.dataset.n = n;
    $('.contador-cifra', li).innerHTML = cifra(n, true);
    ajustarEscena($('.calle-escena', li), Math.min(n, MAX_MINI), false, true);
  });
  pintarResumen(cambios);
}

function cifra(n, conBote) {
  if (!n) return '<span class="contador-txt">Aún no hay conversaciones aquí. Suma la primera.</span>';
  return '<span class="contador-num' + (conBote ? ' bote' : '') + '">' + n + '</span>' +
    '<span class="contador-txt">' + (n === 1 ? 'conversación' : 'conversaciones') + '<br>en esta calle</span>';
}
function contador(id) {
  const n = cuenta(id);
  return '<div class="contador" data-n="' + n + '"><p class="contador-cifra">' + cifra(n, false) + '</p>' +
    '<div class="calle-escena" aria-hidden="true"></div></div>';
}

function tarjetaCalle(c, conMunicipio) {
  const id = idCalle(c);
  const mapa = 'https://www.google.com/maps/search/?api=1&query=' +
    encodeURIComponent([c.calle, c.municipio, c.provincia].filter(Boolean).join(', '));
  return '<li class="calle" data-calle="' + esc(id) + '">' +
    '<div class="placa">' + rotulo(c.calle) +
    (conMunicipio && c.municipio ? '<span class="placa-municipio">' + esc(c.municipio) + '</span>' : '') + '</div>' +
    '<div class="calle-cuerpo">' +
    (c.tramo ? '<p class="tramo">' + esc(c.tramo) + '</p>' : '') +
    (c.nota ? '<p class="nota-calle' + (c.tramo ? '' : ' nota-calle--sola') + '">' + esc(c.nota) + '</p>' : '') +
    contador(id) +
    '<div class="acciones">' +
    '<button class="btn btn--sumar" data-sumar="' + esc(id) + '" aria-label="Sumar una conversación"><span aria-hidden="true">+</span> Sumar</button>' +
    '<a class="btn btn--borde" href="' + esc(mapa) + '" target="_blank" rel="noopener">Cómo llegar</a>' +
    '</div></div></li>';
}

function pintarCalles() {
  if (estado.carga !== 'lista') { $('#v-calles').innerHTML = avisoCarga('Sal a conversar', 'las calles'); return; }
  if (!CALLES.length) {
    $('#v-calles').innerHTML = cartel('Sal a conversar') + '<p class="entrada">Todavía no hay calles publicadas. Vuelve a mirar en un rato.</p>';
    return;
  }
  if (estado.provincia) pintarProvincia(); else pintarSelector();
}

// Un pequeño estallido de píxeles al sumar
function chispas(tarjeta) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const caja = tarjeta && $('.contador', tarjeta);
  if (!caja) return;
  const nuevas = caja.querySelectorAll('.caminante.entra');
  const origen = nuevas.length ? nuevas[nuevas.length - 1] : $('.contador-num', caja);
  if (!origen) return;
  const a = caja.getBoundingClientRect(), b = origen.getBoundingClientRect();
  const x = b.left - a.left + b.width / 2 - 3, y = b.top - a.top + b.height / 2 - 3;
  const colores = ['#ff5ca8', '#ffd23f', '#ffffff'];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('span');
    const ang = (Math.PI * 2 * i) / 12 + Math.random() * .5;
    const dist = 24 + Math.random() * 24;
    s.className = 'chispa';
    s.style.width = s.style.height = '6px';
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.background = colores[i % colores.length];
    s.style.setProperty('--dx', Math.round(Math.cos(ang) * dist) + 'px');
    s.style.setProperty('--dy', Math.round(Math.sin(ang) * dist) + 'px');
    caja.appendChild(s);
    setTimeout(() => s.remove(), 800);
  }
}

$('#v-calles').addEventListener('click', e => {
  const prov = e.target.closest('[data-provincia]');
  if (prov) {
    // La provincia va en la dirección: así se puede compartir el enlace y funciona el botón atrás
    const destino = '#' + slug(prov.dataset.provincia);
    if (location.hash === destino) aplicarRuta(true); else location.hash = destino;
    return;
  }
  if (e.target.closest('#cambiar-provincia')) {
    guardado.escribir('sac:provincia', null);
    if (location.hash === '#calles') aplicarRuta(true); else location.hash = '#calles';
    return;
  }
  if (e.target.closest('#quitar-fijada')) {
    guardado.escribir('sac:ultima', null);
    const fijada = $('#fijada'), titulo = $('#titulo-todas');
    if (fijada) fijada.remove();
    if (titulo) titulo.remove();
    return;
  }
  const chip = e.target.closest('.zona-chip');
  if (chip) {
    estado.municipio = chip.hasAttribute('data-todos') ? null : chip.dataset.municipio;
    pintarLista();
    return;
  }
  if (e.target.closest('#ver-todas')) {
    estado.municipio = null;
    estado.busqueda = '';
    $('#buscar').value = '';
    pintarLista();
    return;
  }
  const boton = e.target.closest('[data-sumar]');
  if (boton) {
    const id = boton.dataset.sumar;
    suma.pendientes.set(id, (suma.pendientes.get(id) || 0) + 1);
    guardarPendientes();
    guardado.escribir('sac:ultima', { provincia: estado.provincia, id: id });   // la próxima vez saldrá arriba
    recontar();
    actualizarCifras();
    chispas(boton.closest('.calle'));
    programarEnvio();
  }
});
$('#v-calles').addEventListener('input', e => {
  if (e.target.id === 'buscar') { estado.busqueda = e.target.value; pintarLista(); }
  if (e.target.id === 'buscar-provincia') { estado.buscaProvincia = e.target.value; filtrarProvincias(); }
});
$('#v-calles').addEventListener('change', e => {
  if (e.target.id !== 'municipio') return;
  const elegido = municipiosVista[Number(e.target.value)];
  estado.municipio = e.target.value === 'todos' || elegido === undefined ? null : elegido;
  pintarLista();
});

/* ============================================================
   Materiales
   ============================================================ */
/* Idiomas de los materiales. En el Sheet, la columna «idioma» de la pestaña Materiales
   admite el nombre o el código (Català, catalan, ca…). Una celda vacía cuenta como
   castellano. Un idioma que no esté en esta lista también vale: sale tal cual se escriba. */
const IDIOMAS = [
  { nombre: 'Castellano', lang: 'es', alias: ['', 'es', 'cas', 'castellano', 'castella', 'espanol', 'spanish'] },
  { nombre: 'Català', lang: 'ca', alias: ['ca', 'cat', 'catala', 'catalan'] },
  { nombre: 'Valencià', lang: 'ca', alias: ['val', 'valencia', 'valenciano'] },
  { nombre: 'Euskara', lang: 'eu', alias: ['eu', 'eus', 'euskara', 'euskera', 'vasco'] },
  { nombre: 'Galego', lang: 'gl', alias: ['gl', 'gal', 'galego', 'gallego'] }
];
function idiomaDe(valor) {
  const escrito = texto(valor);
  const conocido = IDIOMAS.find(i => i.alias.includes(norm(escrito)));
  return conocido ? conocido.nombre : escrito;
}
function langDe(nombre) {
  const conocido = IDIOMAS.find(i => i.nombre === nombre);
  return conocido ? conocido.lang : '';
}

function pintarMateriales() {
  if (estado.carga !== 'lista') { $('#v-materiales').innerHTML = avisoCarga('Materiales', 'los materiales'); return; }
  if (!MATERIALES.length) {
    $('#v-materiales').innerHTML = cartel('Materiales') + '<p class="entrada">Todavía no hay materiales publicados.</p>';
    return;
  }

  // Los idiomas salen solos de lo que haya en el Sheet: castellano primero y el resto en su orden
  const idiomas = [...new Set(MATERIALES.map(m => m.idioma))]
    .sort((a, b) => (a === 'Castellano' ? -1 : b === 'Castellano' ? 1 : 0));
  if (!idiomas.includes(estado.idioma)) {
    // Primero el que eligió esta persona; si no, el de su móvil; si no, castellano
    const elegido = guardado.leer('sac:idioma', null);
    const delMovil = (navigator.language || '').slice(0, 2).toLowerCase();
    estado.idioma = idiomas.includes(elegido) ? elegido
      : idiomas.find(n => langDe(n) === delMovil) || (idiomas.includes('Castellano') ? 'Castellano' : idiomas[0]);
  }
  const selector = idiomas.length < 2 ? '' :
    '<div class="zonas" role="group" aria-label="Idioma de los materiales">' +
    idiomas.map(n => '<button class="zona-chip" data-idioma="' + esc(n) + '" aria-pressed="' + (n === estado.idioma) + '"' +
      (langDe(n) ? ' lang="' + langDe(n) + '"' : '') + '>' + esc(n) + '</button>').join('') +
    '</div>';

  const grupos = [];
  MATERIALES.filter(m => m.idioma === estado.idioma).forEach(m => {
    let g = grupos.find(x => x.nombre === m.grupo);
    if (!g) { g = { nombre: m.grupo, items: [] }; grupos.push(g); }
    g.items.push(m);
  });
  // La etiqueta de «todavía sin enlace», en el idioma elegido
  const pronto = { ca: 'Aviat', eu: 'Laster' }[langDe(estado.idioma)] || 'Pronto';
  const fila = m => {
    const dentro = '<span class="tipo">' + esc(m.tipo) + '</span>' +
      '<span class="fila-texto"><span class="fila-titulo">' + esc(m.titulo) + '</span>' +
      (m.descripcion ? '<span class="fila-desc">' + esc(m.descripcion) + '</span>' : '') + '</span>';
    return m.enlace
      ? '<li><a class="fila" href="' + esc(m.enlace) + '" target="_blank" rel="noopener">' + dentro + '<span class="fila-flecha" aria-hidden="true">→</span></a></li>'
      : '<li><div class="fila fila--sin">' + dentro + '<span class="pronto">' + pronto + '</span></div></li>';
  };
  $('#v-materiales').innerHTML =
    cartel('Materiales') +
    '<p class="entrada">Lo que necesitas leer antes de salir. Cada uno se abre directamente.</p>' +
    selector +
    '<div' + (langDe(estado.idioma) ? ' lang="' + langDe(estado.idioma) + '"' : '') + '>' +
    grupos.map(g => '<div class="grupo"><h2>' + esc(g.nombre) + '</h2><ul class="hoja">' + g.items.map(fila).join('') + '</ul></div>').join('') +
    '</div>';
}

// Cambiar de idioma en Materiales: se recuerda para la próxima vez
$('#v-materiales').addEventListener('click', e => {
  const boton = e.target.closest('[data-idioma]');
  if (!boton) return;
  estado.idioma = boton.dataset.idioma;
  guardado.escribir('sac:idioma', estado.idioma);
  pintarMateriales();
  const activo = $('#v-materiales [data-idioma][aria-pressed="true"]');
  if (activo) activo.focus({ preventScroll: true });
});

function pintarTodo() {
  pintarCalles();
  pintarMateriales();
}

document.addEventListener('click', e => {
  if (!e.target.closest('[data-reintentar]')) return;
  estado.carga = 'cargando';
  pintarTodo();
  cargar();
});

/* ============================================================
   Navegación por pestañas (#calles, #materiales)
   ============================================================ */
const VISTAS = ['calles', 'materiales'];
const TITULOS = { materiales: 'Materiales · ' };

function mostrarVista(actual, sinSubir) {
  VISTAS.forEach(v => { $('#v-' + v).hidden = v !== actual; });
  document.querySelectorAll('.pestana').forEach(a => {
    if (a.dataset.vista === actual) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  // La pestaña Calles vuelve a la provincia abierta, no a la lista de provincias
  $('.pestana[data-vista="calles"]').setAttribute('href', estado.provincia ? '#' + slug(estado.provincia) : '#calles');
  document.title = (actual === 'calles' ? (estado.provincia ? 'Calles de ' + estado.provincia + ' · ' : '') : TITULOS[actual]) + 'Sal a conversar';
  if (!sinSubir) window.scrollTo(0, 0);
}

/* La dirección manda: #materiales es una pestaña, #calles es la lista de
   provincias y #valladolid abre esa provincia. Así cada provincia tiene su enlace para
   compartir y el botón atrás del móvil vuelve a la lista en vez de salir de la web. */
function aplicarRuta(pintar, sinSubir) {
  let h = '';
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { h = ''; }
  const vista = h === 'materiales' ? h : 'calles';
  if (vista === 'calles' && estado.carga === 'lista') {
    let nueva = h && h !== 'calles' ? (PROVINCIAS.find(p => slug(p) === slug(h)) || null) : null;
    if (!nueva && !rutaResuelta && (!h || h === 'calles')) {
      // Al entrar sin provincia en la dirección, se abre la última que eligió esta persona
      const recordada = guardado.leer('sac:provincia', null);
      if (PROVINCIAS.includes(recordada)) nueva = recordada;
    }
    rutaResuelta = true;
    const destino = nueva ? '#' + slug(nueva) : '#calles';
    if (location.hash !== destino) { try { history.replaceState(null, '', destino); } catch (e) { /* sigue igual */ } }
    if (nueva !== estado.provincia) {
      estado.provincia = nueva;
      estado.municipio = null;
      estado.busqueda = '';
      if (nueva) guardado.escribir('sac:provincia', nueva);
      if (pintar) pintarCalles();
    }
  }
  mostrarVista(vista, sinSubir);
}
window.addEventListener('hashchange', () => aplicarRuta(true));

/* ============================================================
   Arranque
   ============================================================ */
// Si ya se abrió antes, se pinta lo último que se vio mientras llega lo nuevo
(function arrancar() {
  const previo = guardado.leer('sac:datos', null);
  if (previo && Array.isArray(previo.calles)) {
    aplicarDatos(previo);
    contenidoPintado = JSON.stringify([previo.calles, previo.materiales]);
  }
  aplicarRuta(false);
  pintarTodo();
  cargar();
  setInterval(refrescar, REFRESCO);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refrescar(); });
  window.addEventListener('online', () => { enviar(); refrescar(); });
})();
</script>
